[project]
name = "tts-app"
version = "0.1.0"
description = "Web app to convert papers and blog posts to audio using Chatterbox TTS"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "chatterbox-tts>=0.1.0",
    "trafilatura>=1.12.0",
    "pymupdf>=1.24.0",
    "pydub>=0.25.1",
    "nltk>=3.9.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "scipy>=1.14.0",
]

[project.scripts]
tts-app = "tts_app.main:run"
