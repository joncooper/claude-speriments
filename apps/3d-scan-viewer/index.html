<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Scan Viewer</title>
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <h1>3D Scan Viewer</h1>
        <p class="subtitle">View 3D scans from Scaniverse and KIRI Engine</p>
      </header>

      <!-- Controls Panel -->
      <div class="controls-panel">
        <div class="file-upload-area">
          <input type="file" id="fileInput" accept=".usdz,.fbx,.obj,.glb,.gltf,.ply,.las" />
          <label for="fileInput" class="upload-label">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span>Choose 3D file or drag & drop</span>
            <span class="supported-formats">USDZ, FBX, OBJ, GLB, PLY, LAS</span>
          </label>
        </div>

        <div class="info-panel" id="infoPanel">
          <div class="info-item">
            <span class="info-label">Format:</span>
            <span id="formatInfo">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Vertices:</span>
            <span id="verticesInfo">-</span>
          </div>
          <div class="info-item">
            <span class="info-label">Faces:</span>
            <span id="facesInfo">-</span>
          </div>
        </div>

        <div class="viewer-controls">
          <button id="resetCamera" class="control-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
              <path d="M21 3v5h-5"></path>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
              <path d="M3 21v-5h5"></path>
            </svg>
            Reset View
          </button>

          <button id="toggleWireframe" class="control-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            Wireframe
          </button>

          <button id="toggleGrid" class="control-btn active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Grid
          </button>

          <button id="togglePoints" class="control-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
              <circle cx="5" cy="12" r="1"></circle>
              <circle cx="19" cy="12" r="1"></circle>
            </svg>
            Points
          </button>
        </div>
      </div>

      <!-- 3D Canvas -->
      <div id="canvasContainer" class="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="loadingIndicator" class="loading-indicator">
          <div class="spinner"></div>
          <p>Loading 3D model...</p>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>Use mouse/touch to rotate • Scroll to zoom • Right-click to pan</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
