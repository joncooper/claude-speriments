[project]
name = "nnterp-mlx"
version = "0.1.0"
description = "Port of nnterp (mechanistic interpretability for transformers) to Apple MLX / mlx-lm"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.20.0",
    "mlx-lm>=0.19.0",
    "numpy>=1.24.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
display = [
    "plotly>=5.0.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
