[project]
name = "audio-transcription-cli"
version = "0.1.0"
description = "A powerful CLI tool for transcribing audio files using local AI models with speaker diarization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Claude Code Experiments" }
]
keywords = ["transcription", "audio", "speech-to-text", "whisper", "diarization", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "pyannote-audio>=3.1",
    "pydub>=0.25.1",
    "rich>=14.2.0",
    "soundfile>=0.13.1",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "transformers>=4.57.1",
    "typer>=0.20.0",
]

[project.scripts]
transcribe = "src.transcribe:app"

[project.urls]
Homepage = "https://github.com/joncooper/claude-speriments"
Repository = "https://github.com/joncooper/claude-speriments"
Issues = "https://github.com/joncooper/claude-speriments/issues"
